<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

  const LIGHT_VARS = {
    background: '#ffffff',
    primaryColor: '#f7f4ea',
    primaryTextColor: '#181818',
    primaryBorderColor: '#0a1f44',
    lineColor: '#5a584f',
    secondaryColor: '#efeadf',
    tertiaryColor: '#ffffff',
    clusterBkg: '#efeadf',
    clusterBorder: '#d4cdb8',
    titleColor: '#181818',
    edgeLabelBackground: '#f7f4ea',
    fontFamily: 'Georgia, serif'
  };

  const DARK_VARS = {
    background: '#0a0d14',
    primaryColor: '#131722',
    primaryTextColor: '#f3f1e8',
    primaryBorderColor: '#6a8fc8',
    lineColor: '#8a8470',
    secondaryColor: '#1a1e2a',
    tertiaryColor: '#131722',
    clusterBkg: '#131722',
    clusterBorder: '#2a2e38',
    titleColor: '#f3f1e8',
    edgeLabelBackground: '#0a0d14',
    fontFamily: 'Georgia, serif'
  };

  const SCOPE_LIGHT = 'classDef scope fill:#f7f4ea,stroke:#a8854d,color:#181818,stroke-width:1.2px';
  const COMP_LIGHT  = 'classDef comp fill:#f7f4ea,stroke:#7a2e2e,color:#181818,stroke-width:1.2px';
  const SCOPE_DARK  = 'classDef scope fill:#131722,stroke:#c9a456,color:#f3f1e8,stroke-width:1.2px';
  const COMP_DARK   = 'classDef comp fill:#131722,stroke:#b97070,color:#f3f1e8,stroke-width:1.2px';

  function preprocess(src, theme) {
    // Remove any existing scope/comp classDef lines so we can re-inject theme-aware ones.
    let out = src.replace(/^\s*classDef\s+scope\s+[^\n]*$/gm, '');
    out = out.replace(/^\s*classDef\s+comp\s+[^\n]*$/gm, '');
    const scopeDef = theme === 'dark' ? SCOPE_DARK : SCOPE_LIGHT;
    const compDef  = theme === 'dark' ? COMP_DARK  : COMP_LIGHT;
    return out + '\n  ' + scopeDef + ';\n  ' + compDef + ';';
  }

  const blocks = document.querySelectorAll('.mermaid');
  blocks.forEach(b => { b.dataset.source = b.textContent; });

  async function render(theme) {
    mermaid.initialize({
      startOnLoad: false,
      securityLevel: 'loose',
      theme: 'base',
      themeVariables: theme === 'dark' ? DARK_VARS : LIGHT_VARS,
      flowchart: { htmlLabels: true }
    });
    blocks.forEach(b => {
      b.innerHTML = preprocess(b.dataset.source, theme);
      b.removeAttribute('data-processed');
    });
    try {
      await mermaid.run({ nodes: Array.from(blocks) });
    } catch (e) {
      console.warn('Mermaid render error', e);
    }
  }

  const initialTheme = document.documentElement.getAttribute('data-theme') || 'light';
  render(initialTheme);

  window.__vlReinitMermaid = function(theme) { render(theme); };
</script>
