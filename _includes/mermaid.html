<script type="module">
  import mermaid from 'https://cdn.jsdelivr.net/npm/mermaid@11/dist/mermaid.esm.min.mjs';

  const LIGHT_VARS = {
    background: '#ffffff',
    primaryColor: '#faf8f2',
    primaryTextColor: '#1a1a1a',
    primaryBorderColor: '#b8941e',
    lineColor: '#6a6866',
    secondaryColor: '#f2ede0',
    tertiaryColor: '#ffffff',
    clusterBkg: '#f2ede0',
    clusterBorder: '#d9d4c5',
    edgeLabelBackground: '#faf8f2',
    fontFamily: 'Georgia, serif'
  };

  const DARK_VARS = {
    background: '#0f0f0f',
    primaryColor: '#1a1a1a',
    primaryTextColor: '#f5f5f0',
    primaryBorderColor: '#d4af37',
    lineColor: '#8a8a82',
    secondaryColor: '#1a1a1a',
    tertiaryColor: '#1a1a1a',
    clusterBkg: '#1a1a1a',
    clusterBorder: '#2a2a28',
    edgeLabelBackground: '#0f0f0f',
    fontFamily: 'Georgia, serif'
  };

  const SCOPE_LIGHT = 'classDef scope fill:#faf8f2,stroke:#b8941e,color:#1a1a1a,stroke-width:1.2px';
  const COMP_LIGHT  = 'classDef comp fill:#faf8f2,stroke:#8b3a3a,color:#1a1a1a,stroke-width:1.2px';
  const SCOPE_DARK  = 'classDef scope fill:#1a1a1a,stroke:#d4af37,color:#f5f5f0,stroke-width:1.2px';
  const COMP_DARK   = 'classDef comp fill:#1a1a1a,stroke:#a4555a,color:#f5f5f0,stroke-width:1.2px';

  function preprocess(src, theme) {
    // Remove any existing scope/comp classDef lines so we can re-inject theme-aware ones.
    let out = src.replace(/^\s*classDef\s+scope\s+[^\n]*$/gm, '');
    out = out.replace(/^\s*classDef\s+comp\s+[^\n]*$/gm, '');
    const scopeDef = theme === 'dark' ? SCOPE_DARK : SCOPE_LIGHT;
    const compDef  = theme === 'dark' ? COMP_DARK  : COMP_LIGHT;
    return out + '\n  ' + scopeDef + ';\n  ' + compDef + ';';
  }

  const blocks = document.querySelectorAll('.mermaid');
  blocks.forEach(b => { b.dataset.source = b.textContent; });

  async function render(theme) {
    mermaid.initialize({
      startOnLoad: false,
      theme: 'base',
      themeVariables: theme === 'dark' ? DARK_VARS : LIGHT_VARS
    });
    blocks.forEach(b => {
      b.innerHTML = preprocess(b.dataset.source, theme);
      b.removeAttribute('data-processed');
    });
    try {
      await mermaid.run({ nodes: Array.from(blocks) });
    } catch (e) {
      console.warn('Mermaid render error', e);
    }
  }

  const initialTheme = document.documentElement.getAttribute('data-theme') || 'light';
  render(initialTheme);

  window.__vlReinitMermaid = function(theme) { render(theme); };
</script>
