<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 630" fill="none">
  <title>Vector Lab — research instruments for critical vector theory</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#0f0f0f"/>
      <stop offset="100%" stop-color="#1a1a1a"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="45%" r="60%">
      <stop offset="0%" stop-color="#d4af37" stop-opacity="0.08"/>
      <stop offset="100%" stop-color="#d4af37" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="1200" height="630" fill="url(#bg)"/>
  <rect width="1200" height="630" fill="url(#glow)"/>

  <!-- Subtle background grid -->
  <g stroke="#2a2a28" stroke-width="0.75" opacity="0.6">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="320" x2="1200" y2="320"/>
    <line x1="0" y1="400" x2="1200" y2="400"/>
    <line x1="0" y1="480" x2="1200" y2="480"/>
    <line x1="0" y1="560" x2="1200" y2="560"/>
    <line x1="100" y1="0" x2="100" y2="630"/>
    <line x1="200" y1="0" x2="200" y2="630"/>
    <line x1="300" y1="0" x2="300" y2="630"/>
    <line x1="400" y1="0" x2="400" y2="630"/>
    <line x1="500" y1="0" x2="500" y2="630"/>
    <line x1="600" y1="0" x2="600" y2="630"/>
    <line x1="700" y1="0" x2="700" y2="630"/>
    <line x1="800" y1="0" x2="800" y2="630"/>
    <line x1="900" y1="0" x2="900" y2="630"/>
    <line x1="1000" y1="0" x2="1000" y2="630"/>
    <line x1="1100" y1="0" x2="1100" y2="630"/>
  </g>

  <!-- Large manifold on the right -->
  <g transform="translate(720,120)" stroke="#d4af37" stroke-width="1.5" fill="none" stroke-linecap="round" opacity="0.85">
    <path d="M 30 60 C 110 30, 290 30, 370 60"/>
    <path d="M 20 120 C 110 80, 290 80, 380 120"/>
    <path d="M 15 180 C 110 140, 290 140, 385 180"/>
    <path d="M 15 240 C 110 280, 290 280, 385 240"/>
    <path d="M 20 300 C 110 340, 290 340, 380 300"/>
    <path d="M 30 360 C 110 390, 290 390, 370 360"/>
    <path d="M 70 30 C 40 150, 40 270, 70 390"/>
    <path d="M 150 20 C 110 150, 110 270, 150 400"/>
    <path d="M 250 20 C 290 150, 290 270, 250 400"/>
    <path d="M 330 30 C 360 150, 360 270, 330 390"/>
  </g>
  <circle cx="920" cy="330" r="5" fill="#d4af37"/>

  <!-- Wordmark (left side) -->
  <text x="80" y="240" font-family="Optima, Futura, Georgia, serif" font-size="96" font-weight="500" fill="#f5f5f0" letter-spacing="10">VECTOR LAB</text>

  <!-- Tagline -->
  <text x="82" y="300" font-family="Georgia, serif" font-size="32" font-style="italic" fill="#d4af37" letter-spacing="0.5">Vector methods for vector theory</text>

  <!-- Secondary strapline -->
  <text x="82" y="380" font-family="Georgia, serif" font-size="22" fill="#8a8a82">Instruments for reading the geometry of language</text>
  <text x="82" y="410" font-family="Georgia, serif" font-size="22" fill="#8a8a82">models, image models, and theoretical corpora.</text>

  <!-- URL -->
  <text x="82" y="550" font-family="Georgia, serif" font-size="20" fill="#f5f5f0" letter-spacing="1">vector-lab-tools.github.io</text>

  <!-- Bottom rule -->
  <line x1="80" y1="500" x2="260" y2="500" stroke="#d4af37" stroke-width="1" opacity="0.6"/>
</svg>
