<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <title>Vector Lab mark</title>
  <!-- Vector field: directional ticks suggesting a field around the V -->
  <g stroke="#6a8fc8" stroke-width="1.8" stroke-linecap="round" opacity="0.5">
    <line x1="8" y1="14" x2="13" y2="9"/>
    <line x1="56" y1="14" x2="51" y2="9"/>
    <line x1="5" y1="32" x2="10" y2="32"/>
    <line x1="59" y1="32" x2="54" y2="32"/>
    <line x1="8" y1="52" x2="13" y2="57"/>
    <line x1="56" y1="52" x2="51" y2="57"/>
  </g>
  <!-- V: two bold vectors meeting at a clean point -->
  <polyline points="18,14 32,46 46,14" stroke="#6a8fc8" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
