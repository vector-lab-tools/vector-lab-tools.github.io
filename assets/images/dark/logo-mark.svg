<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <title>Vector Lab mark</title>
  <!-- Sparse field dots: wider vector field at low opacity -->
  <g fill="#6a8fc8" opacity="0.35">
    <circle cx="4" cy="6" r="0.7"/>
    <circle cx="14" cy="2" r="0.7"/>
    <circle cx="32" cy="2" r="0.7"/>
    <circle cx="60" cy="4" r="0.7"/>
    <circle cx="62" cy="22" r="0.7"/>
    <circle cx="2" cy="30" r="0.7"/>
    <circle cx="60" cy="44" r="0.7"/>
    <circle cx="4" cy="56" r="0.7"/>
    <circle cx="22" cy="62" r="0.7"/>
    <circle cx="48" cy="60" r="0.7"/>
    <circle cx="54" cy="58" r="0.7"/>
    <circle cx="58" cy="60" r="0.7"/>
  </g>
  <!-- Ring of dots around the VL -->
  <g fill="#6a8fc8" opacity="0.6">
    <circle cx="32" cy="10" r="1.5"/>
    <circle cx="48" cy="16" r="1.5"/>
    <circle cx="54" cy="32" r="1.5"/>
    <circle cx="48" cy="48" r="1.5"/>
    <circle cx="32" cy="54" r="1.5"/>
    <circle cx="16" cy="48" r="1.5"/>
    <circle cx="10" cy="32" r="1.5"/>
    <circle cx="16" cy="16" r="1.5"/>
  </g>
  <!-- V: lower sub-manifold -->
  <polyline points="17,22 25,42 33,22" stroke="#6a8fc8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- L: upper sub-manifold (raised 4 units relative to V) -->
  <polyline points="38,18 38,38 48,38" stroke="#6a8fc8" stroke-width="4.5" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
