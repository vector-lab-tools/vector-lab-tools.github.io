<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32" fill="none">
  <rect width="32" height="32" fill="#ffffff"/>
  <!-- Ring of 4 cardinal dots (favicon-scale simplification) -->
  <g fill="#0a1f44" opacity="0.55">
    <circle cx="16" cy="3" r="1.1"/>
    <circle cx="29" cy="16" r="1.1"/>
    <circle cx="16" cy="29" r="1.1"/>
    <circle cx="3" cy="16" r="1.1"/>
  </g>
  <!-- V -->
  <polyline points="8,10 12,21 16,10" stroke="#0a1f44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
  <!-- L (raised) -->
  <polyline points="19,8 19,19 25,19" stroke="#0a1f44" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" fill="none"/>
</svg>
